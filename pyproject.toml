[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gwanbo-ocr"
version = "0.1.0"
description = "OCR pipeline tooling for Gwanbo documents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
]

[project.scripts]
gwanbo-ocr = "gwanbo_ocr.cli:app"

[project.optional-dependencies]
pdf = [
    "pillow>=10.3,<13",
    "pymupdf>=1.24,<2",
    "pypdf>=5,<7",
]
dev = [
    "pyrefly>=1.0,<2",
    "pytest>=8.2,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.5,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # Typer's documented Option/Argument pattern uses call defaults.
    "E501",  # Ported PDF heuristics contain long literal-heavy expressions.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

[tool.pyrefly]
python-version = "3.12"
project-includes = ["src", "tests"]
search-path = [".", "src"]

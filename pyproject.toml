[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gwanbo-ocr"
version = "0.1.0"
description = "OCR pipeline tooling for Gwanbo documents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0.1,<7",
    "rich>=13.7,<16",
    "typer>=0.12,<1",
]

[project.scripts]
gwanbo-ocr = "gwanbo_ocr.cli:app"

[project.optional-dependencies]
pdf = [
    "markitdown[pdf]>=0.1.3,<0.2",
    "markitdown-ocr[llm]>=0.1.0,<0.2",
    "pdfplumber>=0.11,<0.12",
    "pillow>=10.3,<13",
    "pymupdf>=1.24,<2",
    "pypdf>=5,<7",
    "PyPDF2>=3,<4",
    "pypdfium2>=4.30,<6",
    "pytesseract>=0.3,<0.4",
]
qwen = [
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "openai>=1.40,<3",
    "opencv-python-headless>=4.10,<5",
    "pillow>=10.3,<13",
    "qwen-vl-utils==0.0.14",
    "tenacity>=8.3,<10",
]
paddleocr = [
    # Kept as a compatibility extra name. PaddleOCR/PaddlePaddle runtimes are
    # installed in Docker service images, not in the host project venv.
]
services = [
    "fastapi>=0.104,<0.116",
    "python-multipart>=0.0.6,<0.1",
    "uvicorn[standard]>=0.24,<0.31",
    "httpx>=0.27,<1",
    "requests>=2.30,<3",
]
dev = [
    "build>=1.2,<2",
    "mypy>=1.10,<2",
    "pyrefly>=1.0,<2",
    "pytest>=8.2,<10",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<8",
    "pytest-mock>=3.14,<4",
    "ruff>=0.5,<1",
    "types-PyYAML>=6.0,<7",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # Typer's documented Option/Argument pattern uses call defaults.
    "E501",  # Ported PDF heuristics contain long literal-heavy expressions.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.pyrefly]
python-version = "3.12"
project-includes = ["src", "tests", "scripts"]
search-path = [".", "src"]

defaults:
  pdf_renderer: pymupdf
  ocr_engine: paddleocr
  vision_language_model: qwen36_baseline
pdf:
  dpi: 200
  image_format: png
  max_pages: null
ocr:
  paddleocr:
    language: korean
    use_angle_cls: true
    runtime: docker_service
    service_url: http://127.0.0.1:8082
    use_gpu: false
    det_model_dir: null
    rec_model_dir: null
    cls_model_dir: null
  paddleocr_vl:
    pipeline_version: v1.5
    vl_rec_model: PaddlePaddle/PaddleOCR-VL-1.5
    runtime: docker_service
    service_url: http://127.0.0.1:8082
    vl_rec_backend: vllm-server
    vl_rec_server_url: http://127.0.0.1:8118/v1
    vl_rec_api_model_name: PaddlePaddle/PaddleOCR-VL-1.5
    vl_rec_api_key_env: null
services:
  markitdown_ocr_api:
    provider: fastapi
    base_url: http://127.0.0.1:8081
    docker_service: markitdown-ocr-api
    llm_base_url: http://127.0.0.1:8000/v1
    llm_model: Qwen/Qwen3.6-35B-A3B-FP8
  paddleocr_api:
    provider: fastapi
    base_url: http://127.0.0.1:8082
    docker_service: paddleocr-api
  paddleocr_vl_vllm:
    provider: openai_compatible
    base_url: http://127.0.0.1:8118/v1
    model: PaddlePaddle/PaddleOCR-VL-1.5
    docker_service: paddleocr-vl-vllm
vision_language_models:
  qwen36_baseline:
    provider: openai_compatible
    model: Qwen/Qwen3.6-35B-A3B-FP8
    base_url: http://127.0.0.1:8000/v1
    api_key_env: OPENAI_API_KEY
    timeout_seconds: 120
    max_retries: 2
    docker:
      image: vllm/vllm-openai-rocm:latest
      container_name: gwanbo-vllm
      quantization: fp8
      max_model_len: 32768
      max_num_batched_tokens: 32768
      max_num_seqs: 1024
      gpu_memory_utilization: 0.9
      enforce_eager: true
      trust_remote_code: true
      disable_custom_all_reduce: true
  qwen36_lemonade_plain:
    provider: openai_compatible
    model: Qwen3.6-35B-A3B-GGUF
    base_url: http://127.0.0.1:13305/api/v1
    api_key_env: OPENAI_API_KEY
    timeout_seconds: 240
    max_retries: 1
    max_tokens: 1600
    json_mode: false
    system_prompt: null
    user_prompt: Perform full OCR for this single Korean government gazette page.
      Transcribe all visible text in natural reading order. Preserve issue number,
      date, headings, list numbers, notices, tables, amounts, and line breaks. Do
      not summarize. Do not invent repeated sections. If text is unclear, write [unclear].
      Stop when the visible page text is complete. Return plain text only.
  lightonocr2_1b_lemonade_vllm:
    provider: openai_compatible
    model: user.LightOnOCR-2-1B-vLLM
    base_url: http://127.0.0.1:13305/api/v1
    api_key_env: OPENAI_API_KEY
    timeout_seconds: 300
    max_retries: 1
    max_tokens: 4096
    temperature: 0.0
    json_mode: false
    system_prompt: null
    user_prompt: Transcribe all visible text from this document image in natural reading
      order. Preserve Korean text, English text, dates, issue numbers, headings, tables,
      form labels, amounts, and line breaks. Do not summarize. Return only the transcription.
    lemonade:
      recipe: vllm
      backend: rocm
      checkpoint: lightonai/LightOnOCR-2-1B
      ctx_size: 8192
      vllm_args:
      - --trust-remote-code
      - --mm-processor-cache-gb
      - '0'
      - --skip-mm-profiling
      - --max-num-seqs
      - '1'
      - --max-num-batched-tokens
      - '8192'
  chandra_ocr_2_lemonade_vllm:
    provider: openai_compatible
    model: user.chandra-ocr-2-lemonade
    base_url: http://127.0.0.1:13305/api/v1
    api_key_env: OPENAI_API_KEY
    timeout_seconds: 300
    max_retries: 1
    max_tokens: 12384
    temperature: 0.0
    json_mode: false
    system_prompt: null
    user_prompt: Transcribe all visible text from this document image in natural reading
